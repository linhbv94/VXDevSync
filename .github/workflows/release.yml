name: Desktop release (free public runners)
on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:
    inputs:
      tag:
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: vxdevsync_release_${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  prepare:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install cryptography==46.0.3
      - run: python -m scripts.release prepare
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
  build:
    needs: prepare
    if: github.event.repository.private == false
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        runner: [windows-2022, macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    permissions:
      contents: write
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false
      - run: python -m pip install -r requirements_release.txt
      - run: python -m scripts.run_tests
      - run: node --test scripts/test_frontend_security.mjs
      - if: runner.os == 'Windows'
        shell: powershell
        run: |
          if (!(Test-Path "${env:ProgramFiles(x86)}\NSIS\makensis.exe")) { choco install nsis --no-progress -y }
      - run: python -m scripts.build_release
      - run: python -m scripts.upload_packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  finalize:
    needs: [prepare, build]
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install cryptography==46.0.3
      - run: python -m scripts.release finalize
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          VXDEVSYNC_SIGNING_PRIVATE_KEY: ${{ secrets.VXDEVSYNC_SIGNING_PRIVATE_KEY }}
